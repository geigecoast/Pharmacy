name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pharmacore-tests:
    name: PharmaCore-Tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Tests ausführen
        run: swift test --package-path Packages/PharmaCore

  app:
    name: App (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: "platform=macOS"
            sdk: macosx
          - name: iPad-Simulator
            destination: "generic/platform=iOS Simulator"
            sdk: iphonesimulator
    steps:
      - uses: actions/checkout@v5
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project PharmaTutor.xcodeproj \
            -scheme PharmaTutor \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Warnungen prüfen
        run: |
          # Bekannte, harmlose Meldungen der Toolchain ausnehmen.
          grep -E "warning:" build.log \
            | grep -v "appintentsmetadataprocessor" \
            | grep -v "Metadata extraction skipped" \
            | sort -u > warnungen.txt || true
          if [ -s warnungen.txt ]; then
            echo "::error::Der Build enthält Warnungen:"
            cat warnungen.txt
            exit 1
          fi
          echo "Keine Warnungen."
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ matrix.name }}
          path: build.log

  start-test:
    name: Starttest (macOS)
    needs: app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Mac-App starten und Bildschirmfotos aufnehmen
        run: |
          set -euo pipefail
          xcodebuild build -project PharmaTutor.xcodeproj -scheme PharmaTutor \
            -destination "platform=macOS" -derivedDataPath build -configuration Debug \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= -quiet
          APP=$(find build/Build/Products -name "PharmaTutor.app" -path "*Debug/*" -not -path "*iphone*" | head -1)
          mkdir -p bildschirmfotos
          # Erster Start: Einführung
          "$APP/Contents/MacOS/PharmaTutor" > app.log 2>&1 &
          PID=$!
          sleep 15
          screencapture -x bildschirmfotos/mac-1-einfuehrung.png || true
          if kill -0 $PID 2>/dev/null; then echo "App läuft."; else echo "::error::App ist abgestürzt"; cat app.log; exit 1; fi
          kill $PID || true
          sleep 2
          # Zweiter Start ohne Einführung
          "$APP/Contents/MacOS/PharmaTutor" -onboardingAbgeschlossen YES > app2.log 2>&1 &
          PID=$!
          sleep 12
          screencapture -x bildschirmfotos/mac-2-heute.png || true
          if kill -0 $PID 2>/dev/null; then echo "App läuft."; else echo "::error::App ist abgestürzt"; cat app2.log; exit 1; fi
          kill $PID || true
      - name: Bildschirmfotos hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bildschirmfotos-macOS
          path: bildschirmfotos
          if-no-files-found: ignore
